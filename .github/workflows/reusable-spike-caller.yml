# Spike of reusable-spike/README.md, the caller: releases reusable-spike/image through the reusable workflow and the
# composite action, each by full path at the same commit. By hand only: it signs, so no push or pull request runs it.
# The pinned commit is one before the commit that wrote it (uses: takes no expression), so the run log tells them apart.
# Public repository: permissions: {} here, each job grants only what signing needs; actions and the reusable workflow
# pinned to a full commit SHA; persist-credentials: false; no secret is passed.
# Design notes: reusable-spike/README.md.
name: reusable-spike-caller

on:
  workflow_dispatch:

permissions: {}

jobs:
  reusable:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: anhnvcoder/svp-labs/.github/workflows/reusable-spike-called.yml@fa3cf13d77877fa8fde4ca8fe1126e068a304253
    with:
      # The same commit again, only to compare with what the called workflow finds by itself.
      scripts-ref: fa3cf13d77877fa8fde4ca8fe1126e068a304253

  composite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: code
          persist-credentials: false

      - uses: anhnvcoder/svp-labs/.github/actions/reusable-spike@fa3cf13d77877fa8fde4ca8fe1126e068a304253
        with:
          code-root: code
