# Spike, the composite action: used by reusable-spike-caller.yml with its full path at a commit
# (anhnvcoder/svp-labs/.github/actions/reusable-spike@<sha>), as another repository would use it. It shows what the
# runner downloaded for it (the whole repository at that commit, or only this folder), runs the release script from
# the root of that download ($GITHUB_ACTION_PATH/../../..), and attests the build provenance (actions/attest). Steps of
# a composite action run inside the caller's job, so the certificate names the caller's workflow. Findings in
# reusable-spike/README.md.
#
# The caller's job checks out its tree (code-root), grants contents: read, packages: write, id-token: write and
# attestations: write, and runs nothing else. Every action is pinned to a full commit SHA; inputs reach scripts through
# env:, never ${{ }} inside run:; the OIDC token is requested once to print its claims, never the token itself.
name: reusable-spike
description: "Spike: build, sign and attest the caller's tree with the scripts of this repository at the pinned commit"

inputs:
  code-root:
    description: "Checkout of the caller's tree to build"
    required: true

outputs:
  digest:
    description: "Digest of the image signed by this action"
    value: ${{ steps.release.outputs.digest }}

runs:
  using: composite
  steps:
    - name: What the runner downloaded
      shell: bash
      env:
        CTX_ACTION_PATH: ${{ github.action_path }}
        CTX_ACTION_REF: ${{ github.action_ref }}
        CTX_ACTION_REPOSITORY: ${{ github.action_repository }}
        CTX_WORKFLOW_REF: ${{ github.workflow_ref }}
        CTX_WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: |
        echo "github.action_path=$CTX_ACTION_PATH"
        echo "github.action_ref=$CTX_ACTION_REF github.action_repository=$CTX_ACTION_REPOSITORY"
        echo "github.workflow_ref=$CTX_WORKFLOW_REF github.workflow_sha=$CTX_WORKFLOW_SHA"
        echo "GITHUB_ACTION_* variables:"
        env | grep '^GITHUB_ACTION' | sort
        root=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        echo "root of the download: $root"
        ls -la "$root"
        if [ -d "$root/.git" ]; then echo "has .git"; else echo "no .git"; fi
        ls -la "$root/reusable-spike"

    - name: Claims of the OIDC token
      shell: bash
      run: |
        # The token goes into a variable and is never printed; only its payload (the claims) is decoded and shown.
        token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r .value)
        payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
        while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
        base64 -d <<<"$payload" | jq -S .
        unset token payload

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.4

    - name: Log in to GHCR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: Build, sign, attest vuln
      id: release
      shell: bash
      env:
        CODE_ROOT: ${{ inputs.code-root }}
      run: bash "$GITHUB_ACTION_PATH/../../../reusable-spike/release.sh" composite "$CODE_ROOT"

    - name: Attest build provenance
      id: attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ghcr.io/anhnvcoder/svp-labs/reusable-spike
        subject-digest: ${{ steps.release.outputs.digest }}
        push-to-registry: true
        # Storage records exist only for repositories owned by an organization; this one belongs to a user.
        create-storage-record: false

    - name: Summary
      shell: bash
      env:
        DIGEST: ${{ steps.release.outputs.digest }}
        ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
      run: |
        {
          echo "### reusable-spike: composite action"
          echo
          echo "- image: \`ghcr.io/anhnvcoder/svp-labs/reusable-spike@$DIGEST\`"
          echo "- attestation: $ATTESTATION_URL"
        } >> "$GITHUB_STEP_SUMMARY"
