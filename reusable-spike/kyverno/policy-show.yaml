# Spike policy: always refuses, and says in its message what each attestor counts for each image (signature, vuln
# attestation, provenance attestation) and what extractPayload reads from the verified provenance. The attestors:
#   reusable   the SAN of the reusable workflow at any commit (subjectRegExp), nothing else;
#   reusableA  the same, and the certificate extension GithubWorkflowRepository (OID 1.3.6.1.4.1.57264.1.5, the
#              repository of the run) is anhnvcoder/svp-labs, the repository that really called it;
#   reusableB  the same with anhnvcoder/svp-frontend, a repository that did not call it;
#   caller     the SAN of the calling workflow, the identity a composite action signs with.
# A count of 1 or more is a pass, 0 a fail: an attestor that does not match counts 0, not an error.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: reusable-spike-show
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: spike
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/anhnvcoder/svp-labs/reusable-spike@*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: reusable
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/anhnvcoder/svp-labs/\.github/workflows/reusable-spike-called\.yml@[0-9a-f]{40}$'
    - name: reusableA
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/anhnvcoder/svp-labs/\.github/workflows/reusable-spike-called\.yml@[0-9a-f]{40}$'
          additionalExtensions:
            githubWorkflowRepository: anhnvcoder/svp-labs
    - name: reusableB
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/anhnvcoder/svp-labs/\.github/workflows/reusable-spike-called\.yml@[0-9a-f]{40}$'
          additionalExtensions:
            githubWorkflowRepository: anhnvcoder/svp-frontend
    - name: caller
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/anhnvcoder/svp-labs/.github/workflows/reusable-spike-caller.yml@refs/heads/main"
  attestations:
    - name: vuln
      intoto:
        type: https://cosign.sigstore.dev/attestation/vuln/v1
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    - name: matched
      expression: images.containers + images.initContainers + images.ephemeralContainers
  validations:
    - expression: "false"
      messageExpression: >-
        variables.matched.map(i, i + ' ->' +
          ' sig[reusable,A,B,caller]=' + string(verifyImageSignatures(i, [attestors.reusable])) + ',' +
            string(verifyImageSignatures(i, [attestors.reusableA])) + ',' +
            string(verifyImageSignatures(i, [attestors.reusableB])) + ',' +
            string(verifyImageSignatures(i, [attestors.caller])) +
          ' vuln=' + string(verifyAttestationSignatures(i, attestations.vuln, [attestors.reusable])) + ',' +
            string(verifyAttestationSignatures(i, attestations.vuln, [attestors.reusableA])) + ',' +
            string(verifyAttestationSignatures(i, attestations.vuln, [attestors.reusableB])) + ',' +
            string(verifyAttestationSignatures(i, attestations.vuln, [attestors.caller])) +
          ' provenance=' + string(verifyAttestationSignatures(i, attestations.provenance, [attestors.reusable])) + ',' +
            string(verifyAttestationSignatures(i, attestations.provenance, [attestors.reusableA])) + ',' +
            string(verifyAttestationSignatures(i, attestations.provenance, [attestors.reusableB])) + ',' +
            string(verifyAttestationSignatures(i, attestations.provenance, [attestors.caller])) +
          ' builder.id=' + extractPayload(i, attestations.provenance).?predicate.?runDetails.?builder.?id.orValue('<none>') +
          ' repository=' + extractPayload(i, attestations.provenance).?predicate.?buildDefinition.?externalParameters.?workflow.?repository.orValue('<none>') +
          ' ref=' + extractPayload(i, attestations.provenance).?predicate.?buildDefinition.?externalParameters.?workflow.?ref.orValue('<none>')).join('; ')
