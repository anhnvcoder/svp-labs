# Control of policy.yaml: the same policy with the signer of each source on another branch (refs/heads/other). The
# provenance of both images, old format and new, must now be refused by the first check: the pass of policy.yaml is
# the signature check passing, not a check that never ran.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: attest-spike-wrong-identity
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: spike
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/anhnvcoder/svp-backend/gateway@*"
    - glob: "ghcr.io/anhnvcoder/svp-backend/drill-no-provenance@*"
    - glob: "ghcr.io/anhnvcoder/svp-labs/attest-spike@*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: backend
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/anhnvcoder/svp-backend/.github/workflows/images.yml@refs/heads/other"
    - name: labs
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/anhnvcoder/svp-labs/.github/workflows/attest-spike.yml@refs/heads/other"
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    - name: matched
      expression: images.containers + images.initContainers + images.ephemeralContainers
    # The attestor, subject, repository and ref of the source an image belongs to, picked by its prefix.
    - name: unproven
      expression: >-
        variables.matched.filter(i,
          (i.startsWith('ghcr.io/anhnvcoder/svp-backend/') && verifyAttestationSignatures(i, attestations.provenance, [attestors.backend]) == 0) ||
          (i.startsWith('ghcr.io/anhnvcoder/svp-labs/') && verifyAttestationSignatures(i, attestations.provenance, [attestors.labs]) == 0))
    - name: wrongBuilder
      expression: >-
        variables.matched.filter(i,
          extractPayload(i, attestations.provenance).?predicate.?runDetails.?builder.?id.orValue('') !=
          (i.startsWith('ghcr.io/anhnvcoder/svp-backend/') ? 'https://github.com/anhnvcoder/svp-backend/.github/workflows/images.yml@refs/heads/main' :
           i.startsWith('ghcr.io/anhnvcoder/svp-labs/') ? 'https://github.com/anhnvcoder/svp-labs/.github/workflows/attest-spike.yml@refs/heads/main' : ''))
    - name: wrongRepository
      expression: >-
        variables.matched.filter(i,
          extractPayload(i, attestations.provenance).?predicate.?buildDefinition.?externalParameters.?workflow.?repository.orValue('') !=
          (i.startsWith('ghcr.io/anhnvcoder/svp-backend/') ? 'https://github.com/anhnvcoder/svp-backend' :
           i.startsWith('ghcr.io/anhnvcoder/svp-labs/') ? 'https://github.com/anhnvcoder/svp-labs' : ''))
    - name: wrongRef
      expression: >-
        variables.matched.filter(i,
          extractPayload(i, attestations.provenance).?predicate.?buildDefinition.?externalParameters.?workflow.?ref.orValue('') != 'refs/heads/main')
  validations:
    - expression: size(variables.unproven) == 0
      messageExpression: >-
        'image without a provenance attestation signed by the workflow of its source: ' + variables.unproven.join(', ')
    - expression: size(variables.wrongBuilder) == 0
      messageExpression: >-
        'provenance builder.id is not the workflow of its source: ' + variables.wrongBuilder.join(', ')
    - expression: size(variables.wrongRepository) == 0
      messageExpression: >-
        'provenance workflow repository is not the repository of its source: ' + variables.wrongRepository.join(', ')
    - expression: size(variables.wrongRef) == 0
      messageExpression: >-
        'provenance workflow ref is not the ref of its source: ' + variables.wrongRef.join(', ')
