# Spike policy: three checks of svp-policy that read the registry, in its order and with its messages: a keyless
# signature (check 2), a vuln attestation (check 3) and a provenance attestation (check 7), each signed by the workflow
# of the image's source, for the same two sources as policy.yaml. What a release whose provenance alone is a Sigstore
# bundle meets: the svp-labs image carries one bundle (provenance, written by actions/attest) and nothing else.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: attest-spike-signed
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: spike
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/anhnvcoder/svp-backend/gateway@*"
    - glob: "ghcr.io/anhnvcoder/svp-backend/drill-no-provenance@*"
    - glob: "ghcr.io/anhnvcoder/svp-labs/attest-spike@*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: backend
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/anhnvcoder/svp-backend/.github/workflows/images.yml@refs/heads/main"
    - name: labs
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/anhnvcoder/svp-labs/.github/workflows/attest-spike.yml@refs/heads/main"
  attestations:
    - name: vuln
      intoto:
        type: https://cosign.sigstore.dev/attestation/vuln/v1
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    - name: matched
      expression: images.containers + images.initContainers + images.ephemeralContainers
    # The attestor of the source an image belongs to, picked by its prefix.
    - name: unsigned
      expression: >-
        variables.matched.filter(i,
          (i.startsWith('ghcr.io/anhnvcoder/svp-backend/') && verifyImageSignatures(i, [attestors.backend]) == 0) ||
          (i.startsWith('ghcr.io/anhnvcoder/svp-labs/') && verifyImageSignatures(i, [attestors.labs]) == 0))
    - name: unattested
      expression: >-
        variables.matched.filter(i,
          (i.startsWith('ghcr.io/anhnvcoder/svp-backend/') && verifyAttestationSignatures(i, attestations.vuln, [attestors.backend]) == 0) ||
          (i.startsWith('ghcr.io/anhnvcoder/svp-labs/') && verifyAttestationSignatures(i, attestations.vuln, [attestors.labs]) == 0))
    - name: unproven
      expression: >-
        variables.matched.filter(i,
          (i.startsWith('ghcr.io/anhnvcoder/svp-backend/') && verifyAttestationSignatures(i, attestations.provenance, [attestors.backend]) == 0) ||
          (i.startsWith('ghcr.io/anhnvcoder/svp-labs/') && verifyAttestationSignatures(i, attestations.provenance, [attestors.labs]) == 0))
  validations:
    - expression: size(variables.unsigned) == 0
      messageExpression: >-
        'image without a keyless signature by the workflow of its source: ' + variables.unsigned.join(', ')
    - expression: size(variables.unattested) == 0
      messageExpression: >-
        'image without a vuln attestation signed by the workflow of its source: ' + variables.unattested.join(', ')
    - expression: size(variables.unproven) == 0
      messageExpression: >-
        'image without a provenance attestation signed by the workflow of its source: ' + variables.unproven.join(', ')
