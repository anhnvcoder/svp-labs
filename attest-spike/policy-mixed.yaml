# Template for ./mixed.sh legacy|mixed|moved, which fills in IMAGE (the glob of its copy of a gateway release) and KEY
# (the public key it makes for the run). The checks of svp-policy that read the registry for that release: signature
# (check 2), vuln attestation (check 3) and provenance attestation (check 7), each with its own message, in that order.
# Each check accepts the identity of svp-backend (keyless, what the copy carries in the old format) or the run's key
# (what moved signs its bundle with), so a refusal never comes from the attestor of a bundle.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: attest-spike-mixed
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "@IMAGE@"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: backend
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/anhnvcoder/svp-backend/.github/workflows/images.yml@refs/heads/main"
    - name: key
      cosign:
        key:
          data: |
            @KEY@
        # Nothing was uploaded to a transparency log.
        ctlog:
          insecureIgnoreTlog: true
  attestations:
    - name: vuln
      intoto:
        type: https://cosign.sigstore.dev/attestation/vuln/v1
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    - name: matched
      expression: images.containers + images.initContainers + images.ephemeralContainers
  validations:
    - expression: variables.matched.all(i, verifyImageSignatures(i, [attestors.backend, attestors.key]) > 0)
      message: image without a keyless signature by the workflow of its source
    - expression: variables.matched.all(i, verifyAttestationSignatures(i, attestations.vuln, [attestors.backend, attestors.key]) > 0)
      message: image without a vuln attestation signed by the workflow of its source
    - expression: variables.matched.all(i, verifyAttestationSignatures(i, attestations.provenance, [attestors.backend, attestors.key]) > 0)
      message: image without a provenance attestation signed by the workflow of its source
